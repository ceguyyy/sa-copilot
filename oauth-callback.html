<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SA Copilot login</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 32rem; margin: 15vh auto; padding: 0 1rem; color: #1d1d1b; background: #f6f4ee; }
  @media (prefers-color-scheme: dark) { body { background: #161614; color: #ecebe6; } }
</style>
</head>
<body>
<h1>SA Copilot login</h1>
<p id="message">Returning to SA Copilot on this computer…</p>
<script>
  // An MCP OAuth login (e.g. Cekat MCP) ends here because the OAuth server only accepts https redirects. This page
  // stores nothing: it hands the OAuth reply to SA Copilot on this computer (127.0.0.1, the port at the start of the
  // state), which checks the single-use state and exchanges the code with its PKCE verifier.
  (function () {
    var allowed = ['code', 'state', 'error', 'error_description', 'iss'];
    var query = new URLSearchParams(location.search);
    var port = /^(\d{2,5})\./.exec(query.get('state') || '');
    var out = new URLSearchParams();
    query.forEach(function (value, key) { if (allowed.indexOf(key) >= 0) out.set(key, value); });
    if (!port || Number(port[1]) > 65535) {
      document.getElementById('message').textContent = 'This login reply is not from SA Copilot. Start the login again from SA Copilot › Settings › AI tools.';
      return;
    }
    location.replace('http://127.0.0.1:' + port[1] + '/api/mcp-oauth/callback?' + out.toString());
  })();
</script>
</body>
</html>
