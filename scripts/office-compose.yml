services:
  claude-office:
    # The backend requires loopback clients, including inside Docker.
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    ports: !override
      - "127.0.0.1:8000:8080"
  office-proxy:
    image: nginx:1.28-alpine
    network_mode: "service:claude-office"
    depends_on:
      - claude-office
    volumes:
      - ../../scripts/office-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
